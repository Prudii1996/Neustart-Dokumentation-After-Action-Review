<style>

  :root{
    --bg:#0c0f18; --surface:#141824; --deep:#080b12; --border:#252d3d;
    --accent:#f59e0b; --text:#dde3f0; --muted:#7a8599;
    --danger:#ef4444; --warn:#f59e0b; --ok:#10b981; --purple:#8b5cf6; --blue:#3b82f6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);min-height:100%}
  body{font-family:'IBM Plex Sans',sans-serif;-webkit-text-size-adjust:100%}
  input,textarea,select,button{font-family:inherit;font-size:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(245,158,11,.14);outline:none}
  button{cursor:pointer}
  button:hover{filter:brightness(1.12)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .wrap{max-width:1140px;margin:0 auto;padding:20px 16px}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .side{border-left:1px solid var(--border);padding-left:20px;overflow-y:auto;max-height:calc(100vh - 96px)}
  .bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;
       display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
       position:sticky;top:0;z-index:20}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:14px}
  .hd{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
      text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
  label.l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
  .in{background:var(--deep);border:1px solid var(--border);border-radius:4px;color:var(--text);
      padding:9px 12px;font-size:14px;width:100%}
  textarea.in{resize:vertical;min-height:78px;line-height:1.55}
  .btn{background:var(--accent);color:#111;border:none;border-radius:4px;padding:10px 22px;
       font-size:13px;font-weight:800;font-family:'Barlow Condensed',sans-serif;
       letter-spacing:.08em;text-transform:uppercase}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 14px;font-size:12px}
  .chip{padding:5px 11px;border-radius:3px;border:1px solid var(--border);background:transparent;
        color:var(--muted);font-size:12.5px;line-height:1.3}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .num{font-family:'IBM Plex Mono',monospace;font-weight:700}
  .h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;
      text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
  .stepper{width:30px;height:30px;border-radius:4px;border:1px solid var(--border);
           background:transparent;color:var(--text);font-size:17px;line-height:1}
  .save{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    .side{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:18px;max-height:none}
    .grid2,.grid3{grid-template-columns:1fr}
    .grid4{grid-template-columns:repeat(2,1fr)}
    .bar{position:static}
  }
  @media print{
    .no-print{display:none!important}
    body,html{background:#fff!important;color:#111!important}
    .card{border-color:#bbb!important;background:#fff!important;break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

</style>
</head>
<body>
