<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neustart · Fortbildungsdokumentation & AAR</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- React + Babel (no build step needed) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0f18; color: #dde3f0; }
    body { font-family: 'IBM Plex Sans', sans-serif; }
    input, textarea, select, button { font-family: inherit; }
    input:focus, textarea:focus, select:focus {
      border-color: #f59e0b !important;
      box-shadow: 0 0 0 2px rgba(245,158,11,0.12);
      outline: none;
    }
    button:hover { opacity: 0.82; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0c0f18; }
    ::-webkit-scrollbar-thumb { background: #252d3d; border-radius: 3px; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #111 !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ── Constants ────────────────────────────────────────────────── */
    const DAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
    const EVENT_TYPES = ["Brand","Krankheit","Vorfall","Unterversorgung","Aufstand","Sonstiges"];
    const EVENT_ICONS = { Brand:"🔥", Krankheit:"🏥", Vorfall:"⚠️", Unterversorgung:"📦", Aufstand:"🚨", Sonstiges:"📝" };
    const DISTRICTS = ["Altstadt","Rathausviertel","Bahnhofsviertel","Neustadt","Kirchfelden","Leuberg","Berghausen","Blauheim","Grafeneck","Gänsheiden","Oberried","Wiesbach","Auhof","In der Höll","Einingen"];
    const SCENARIOS = ["Schwarzbach (leicht)","Zell-Herbertingen (mittel)","Stephansfeld a.d. Fritzel (schwer)","Eigener Aufbau"];

    /* ── Design tokens ─────────────────────────────────────────────── */
    const C = {
      bg:"#0c0f18", surface:"#141824", border:"#252d3d",
      accent:"#f59e0b", accentD:"rgba(245,158,11,0.09)", accentB:"rgba(245,158,11,0.21)",
      text:"#dde3f0", muted:"#7a8599",
      danger:"#ef4444", warn:"#f59e0b",
      success:"#10b981", purple:"#8b5cf6",
    };

    const hexBadge = (color) => ({
      display:"inline-flex", alignItems:"center", padding:"2px 9px",
      borderRadius:3, fontSize:11, fontWeight:700, letterSpacing:"0.07em",
      textTransform:"uppercase",
      background: color + "33", color,
      border:`1px solid ${color}66`,
    });

    /* ── Data factory ──────────────────────────────────────────────── */
    const mkDay = () => ({
      briefing:"",
      tag:   { events:[], priorities:"", confidence:3, disputes:"", fuel:"ausreichend", supplies:"ausreichend" },
      nacht: { events:[], priorities:"", confidence:3, disputes:"", fuel:"ausreichend", supplies:"ausreichend" },
      eval:  { underserved:[], deaths:0, ruins:0, uprisings:0, coordination:null, notes:"" },
    });

    /* ── Shared style objects ──────────────────────────────────────── */
    const inp = {
      background:"#080b12", border:`1px solid ${C.border}`, borderRadius:4,
      color:C.text, padding:"8px 12px", fontSize:14,
      width:"100%", boxSizing:"border-box",
    };
    const ta   = { ...inp, resize:"vertical", minHeight:80 };
    const selS = { ...inp, width:"auto", cursor:"pointer", padding:"7px 10px", fontSize:13 };
    const btn  = {
      background:C.accent, color:"#111", border:"none", borderRadius:4,
      padding:"9px 22px", fontSize:13, fontWeight:800, cursor:"pointer",
      fontFamily:"'Barlow Condensed', sans-serif", letterSpacing:"0.08em", textTransform:"uppercase",
    };
    const card = { background:C.surface, border:`1px solid ${C.border}`, borderRadius:8, padding:20 };
    const lbl  = {
      fontSize:11, color:C.muted, textTransform:"uppercase",
      letterSpacing:"0.08em", marginBottom:6, display:"block",
    };

    /* ── AAR Question ──────────────────────────────────────────────── */
    function AARQuestion({ num, title, hint, value, onChange }) {
      return (
        <div style={{ ...card, marginBottom:14 }}>
          <div style={{ display:"flex", gap:12, alignItems:"flex-start", marginBottom:10 }}>
            <span style={{
              fontFamily:"'IBM Plex Mono', monospace", fontSize:11, color:C.accent,
              background:C.accentD, border:`1px solid ${C.accentB}`, borderRadius:3,
              padding:"2px 8px", whiteSpace:"nowrap", marginTop:2,
            }}>{num}</span>
            <div>
              <div style={{
                fontFamily:"'Barlow Condensed', sans-serif", fontSize:17, fontWeight:700,
                textTransform:"uppercase", letterSpacing:"0.06em", color:C.text,
              }}>{title}</div>
              {hint && <div style={{ fontSize:12, color:C.muted, marginTop:4, lineHeight:1.6 }}>{hint}</div>}
            </div>
          </div>
          <textarea
            style={{ ...ta, minHeight:90 }}
            placeholder="Antwort hier..."
            value={value}
            onChange={e => onChange(e.target.value)}
          />
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════════
       MAIN APP
    ══════════════════════════════════════════════════════════════════ */
    function App() {
      const [phase,     setPhase]    = useState("setup");
      const [session,   setSession]  = useState({ scenario:"", date:"", participants:"", facilitator:"", notes:"" });
      const [days,      setDays]     = useState([mkDay()]);
      const [curDay,    setCurDay]   = useState(0);
      const [curPeriod, setCurPeriod]= useState("tag");
      const [result,    setResult]   = useState({ won:null, score:"", notes:"" });
      const [aar,       setAar]      = useState({ planned:"", happened:"", wentWell:"", wentPoorly:"", different:"", transfer:"" });
      const [newEvent,  setNewEvent] = useState({ type:"Brand", district:"Altstadt" });

      const day    = days[curDay] || mkDay();
      const period = curPeriod !== "eval" ? day[curPeriod] : null;

      const updDay = (idx, fn) => setDays(prev => prev.map((d,i) => i===idx ? fn(d) : d));
      const updPer = (f, v)   => updDay(curDay, d => ({ ...d, [curPeriod]:{ ...d[curPeriod], [f]:v } }));
      const updEval= (f, v)   => updDay(curDay, d => ({ ...d, eval:{ ...d.eval, [f]:v } }));

      const addEvent = () => {
        updDay(curDay, d => ({
          ...d, [curPeriod]:{ ...d[curPeriod],
            events:[...d[curPeriod].events, { ...newEvent, id:Date.now() }]
          }
        }));
      };
      const removeEvent = id =>
        updDay(curDay, d => ({
          ...d, [curPeriod]:{ ...d[curPeriod],
            events: d[curPeriod].events.filter(e => e.id !== id)
          }
        }));

      const toggleDistrict = dist => {
        const list = day.eval.underserved;
        updEval("underserved", list.includes(dist) ? list.filter(x=>x!==dist) : [...list, dist]);
      };

      const advance = () => {
        if (curPeriod==="tag")   return setCurPeriod("nacht");
        if (curPeriod==="nacht") return setCurPeriod("eval");
        const next = curDay + 1;
        if (next <= 6) {
          if (next >= days.length) setDays(prev=>[...prev, mkDay()]);
          setCurDay(next); setCurPeriod("tag");
        } else {
          setPhase("aar");
        }
      };

      const stats = days.reduce((a,d) => ({
        deaths:      a.deaths      + (d.eval.deaths||0),
        ruins:       a.ruins       + (d.eval.ruins||0),
        uprisings:   a.uprisings   + (d.eval.uprisings||0),
        underserved: a.underserved + (d.eval.underserved?.length||0),
        lowConf:     a.lowConf     + (d.tag.confidence<=2?1:0) + (d.nacht.confidence<=2?1:0),
        fuelLow:     a.fuelLow     + (d.tag.fuel==="knapp"||d.nacht.fuel==="knapp"?1:0),
        suppLow:     a.suppLow     + (d.tag.supplies==="knapp"||d.nacht.supplies==="knapp"?1:0),
      }), { deaths:0, ruins:0, uprisings:0, underserved:0, lowConf:0, fuelLow:0, suppLow:0 });

      /* ════════════════ SETUP SCREEN ════════════════ */
      if (phase === "setup") return (
        <div style={{ minHeight:"100vh", background:C.bg, color:C.text }}>

          {/* Header */}
          <div style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:"14px 28px", display:"flex", alignItems:"center", gap:16 }}>
            <div style={{ width:6, height:32, background:C.accent, borderRadius:2 }} />
            <div>
              <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:21, fontWeight:700, letterSpacing:"0.07em", color:C.accent, textTransform:"uppercase" }}>
                Neustart · Fortbildungsdokumentation
              </div>
              <div style={{ fontSize:11, color:C.muted, letterSpacing:"0.1em", textTransform:"uppercase", marginTop:1 }}>
                Spielprotokoll &amp; After Action Review
              </div>
            </div>
          </div>

          <div style={{ maxWidth:660, margin:"0 auto", padding:"36px 24px" }}>
            <h2 style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:28, fontWeight:700, color:C.text, textTransform:"uppercase", marginBottom:6 }}>
              Session einrichten
            </h2>
            <p style={{ color:C.muted, fontSize:14, lineHeight:1.7, marginBottom:28 }}>
              Erfasse die Rahmendaten vor Spielbeginn. Alle Einträge fließen automatisch in die After Action Review ein.
            </p>

            <div style={{ ...card, marginBottom:16 }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16, marginBottom:16 }}>
                <div>
                  <label style={lbl}>Szenario</label>
                  <select style={{ ...selS, width:"100%" }} value={session.scenario}
                    onChange={e=>setSession(s=>({...s,scenario:e.target.value}))}>
                    <option value="">— bitte wählen —</option>
                    {SCENARIOS.map(sc=><option key={sc} value={sc}>{sc}</option>)}
                  </select>
                </div>
                <div>
                  <label style={lbl}>Datum</label>
                  <input style={inp} type="date" value={session.date}
                    onChange={e=>setSession(s=>({...s,date:e.target.value}))} />
                </div>
                <div>
                  <label style={lbl}>Teilnehmende</label>
                  <input style={inp} type="text" placeholder="z. B. 5 Personen, Führungsstab BOS"
                    value={session.participants}
                    onChange={e=>setSession(s=>({...s,participants:e.target.value}))} />
                </div>
                <div>
                  <label style={lbl}>Seminarleitung</label>
                  <input style={inp} type="text" placeholder="Name"
                    value={session.facilitator}
                    onChange={e=>setSession(s=>({...s,facilitator:e.target.value}))} />
                </div>
              </div>
              <div>
                <label style={lbl}>Lernziele / Vorbemerkungen</label>
                <textarea style={ta}
                  placeholder="Was sollen Teilnehmende mitnehmen? Gibt es konkrete Schwerpunkte (z. B. Ressourcenmanagement, Kommunikation im Stab, Priorisierung unter Zeitdruck)?"
                  value={session.notes}
                  onChange={e=>setSession(s=>({...s,notes:e.target.value}))} />
              </div>
            </div>

            <div style={{ ...card, marginBottom:28, borderColor:C.accentB, background:C.accentD }}>
              <div style={{ fontSize:13, color:C.muted, lineHeight:1.8 }}>
                <strong style={{ color:C.accent }}>Wie die App funktioniert:</strong><br/>
                Nach jeder 7-Minuten-Phase (Tag / Nacht) kurz dokumentieren: Ereignisse, Entscheidungen, Ressourcenstatus, Unsicherheiten.
                Am Tagesende erfolgt eine Kurzauswertung. Nach Spielende generiert die App eine
                strukturierte <strong style={{ color:C.text }}>After Action Review</strong> – mit automatischen Hinweisen aus dem Protokoll.
              </div>
            </div>

            <button style={btn} onClick={()=>setPhase("game")}>Spiel starten →</button>
          </div>
        </div>
      );

      /* ════════════════ GAME SCREEN ════════════════ */
      if (phase === "game") {
        const pLabel = curPeriod==="tag" ? "Tag" : curPeriod==="nacht" ? "Nacht" : "Tagesauswertung";
        const pColor = curPeriod==="tag" ? "#3b82f6" : curPeriod==="nacht" ? "#8b5cf6" : C.accent;

        return (
          <div style={{ minHeight:"100vh", background:C.bg, color:C.text }}>

            {/* Top bar */}
            <div style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:"11px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:16, flexWrap:"wrap" }}>
              <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:18, fontWeight:700, letterSpacing:"0.07em", color:C.accent, textTransform:"uppercase", whiteSpace:"nowrap" }}>
                ◈ Neustart
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                {DAYS.map((d,i)=>(
                  <div key={i} title={d} style={{ width:i===curDay?10:7, height:i===curDay?10:7, borderRadius:"50%", background:i===curDay?pColor:i<curDay?"#374151":C.border, border:`1px solid ${i<=curDay?C.border:"transparent"}`, transition:"all 0.2s" }} />
                ))}
                <span style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:15, fontWeight:700, color:C.text, marginLeft:8, letterSpacing:"0.04em" }}>
                  {DAYS[curDay]}
                </span>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ ...hexBadge(pColor), fontSize:12 }}>{pLabel}</span>
                <button style={{ ...btn, background:"transparent", color:C.muted, border:`1px solid ${C.border}`, padding:"6px 14px", fontSize:12 }}
                  onClick={()=>setPhase("aar")}>→ Zur AAR</button>
              </div>
            </div>

            {/* Body */}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 300px", maxWidth:1080, margin:"0 auto", padding:"22px 16px", gap:0 }}>

              {/* ── Main column ── */}
              <div style={{ paddingRight:20 }}>

                {curPeriod !== "eval" ? (
                  <>
                    <h3 style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:22, fontWeight:700, textTransform:"uppercase", color:pColor, marginBottom:18, letterSpacing:"0.04em" }}>
                      {DAYS[curDay]} — {pLabel}
                    </h3>

                    {/* Events */}
                    <div style={{ ...card, marginBottom:14 }}>
                      <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:C.muted, marginBottom:12 }}>
                        Ereignisse dieser Phase
                      </div>
                      <div style={{ display:"flex", gap:8, marginBottom:10, flexWrap:"wrap" }}>
                        <select style={selS} value={newEvent.type}
                          onChange={e=>setNewEvent(n=>({...n,type:e.target.value}))}>
                          {EVENT_TYPES.map(t=><option key={t} value={t}>{EVENT_ICONS[t]} {t}</option>)}
                        </select>
                        <select style={{ ...selS, flex:1, minWidth:140 }} value={newEvent.district}
                          onChange={e=>setNewEvent(n=>({...n,district:e.target.value}))}>
                          {DISTRICTS.map(d=><option key={d} value={d}>{d}</option>)}
                        </select>
                        <button style={{ ...btn, padding:"7px 14px", fontSize:12 }} onClick={addEvent}>
                          ＋ Hinzufügen
                        </button>
                      </div>
                      {period.events.length === 0
                        ? <div style={{ fontSize:13, color:C.muted, fontStyle:"italic", paddingTop:4 }}>Noch keine Ereignisse.</div>
                        : <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                            {period.events.map(ev=>(
                              <div key={ev.id} style={{ display:"flex", alignItems:"center", gap:5, background:"#080b12", border:`1px solid ${C.border}`, borderRadius:4, padding:"4px 10px", fontSize:12 }}>
                                <span>{EVENT_ICONS[ev.type]} {ev.type}</span>
                                <span style={{ color:C.muted }}>·</span>
                                <span style={{ color:C.accent }}>{ev.district}</span>
                                <button onClick={()=>removeEvent(ev.id)} style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:15, lineHeight:1, marginLeft:2, padding:0 }}>×</button>
                              </div>
                            ))}
                          </div>
                      }
                    </div>

                    {/* Priorities */}
                    <div style={{ ...card, marginBottom:14 }}>
                      <label style={lbl}>Was hat der Krisenstab priorisiert?</label>
                      <textarea style={ta}
                        placeholder="Welche Entscheidungen wurden getroffen? Welche Aktionen standen im Vordergrund? Gab es Abstimmungsbedarf?"
                        value={period.priorities}
                        onChange={e=>updPer("priorities", e.target.value)} />
                    </div>

                    {/* Confidence + disputes */}
                    <div style={{ ...card, marginBottom:14, display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
                      <div>
                        <label style={lbl}>Entscheidungssicherheit der Gruppe</label>
                        <div style={{ display:"flex", gap:6, marginBottom:6 }}>
                          {[1,2,3,4,5].map(n=>(
                            <button key={n} onClick={()=>updPer("confidence",n)} style={{
                              width:34, height:34, borderRadius:4,
                              border:`1px solid ${n<=period.confidence ? C.accent : C.border}`,
                              background: n<=period.confidence ? C.accentD : "transparent",
                              color: n<=period.confidence ? C.accent : C.muted,
                              fontSize:13, fontWeight:700, cursor:"pointer",
                              fontFamily:"'IBM Plex Mono', monospace",
                            }}>{n}</button>
                          ))}
                        </div>
                        <div style={{ fontSize:11, color:C.muted }}>1 = sehr unsicher · 5 = sehr sicher</div>
                      </div>
                      <div>
                        <label style={lbl}>Was war unklar oder umstritten?</label>
                        <textarea style={{ ...ta, minHeight:62 }}
                          placeholder="Meinungsverschiedenheiten, Informationsmangel, Rollenunklarheiten..."
                          value={period.disputes}
                          onChange={e=>updPer("disputes", e.target.value)} />
                      </div>
                    </div>

                    {/* Resources */}
                    <div style={{ ...card, marginBottom:22 }}>
                      <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:C.muted, marginBottom:12 }}>
                        Ressourcenstatus am Phasenende
                      </div>
                      <div style={{ display:"flex", gap:28, flexWrap:"wrap" }}>
                        {[["fuel","⛽ Treibstoff"],["supplies","📦 Versorgungsgüter"]].map(([key,label])=>(
                          <div key={key}>
                            <div style={{ fontSize:12, color:C.muted, marginBottom:7 }}>{label}</div>
                            <div style={{ display:"flex", gap:5 }}>
                              {[["knapp",C.danger],["ausreichend",C.warn],["gut",C.success]].map(([opt,col])=>{
                                const active = period[key]===opt;
                                return (
                                  <button key={opt} onClick={()=>updPer(key,opt)} style={{
                                    padding:"4px 11px", borderRadius:3,
                                    border:`1px solid ${active ? col : C.border}`,
                                    background: active ? col+"33" : "transparent",
                                    color: active ? col : C.muted,
                                    fontSize:12, cursor:"pointer", fontWeight: active?600:400,
                                  }}>{opt}</button>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                ) : (
                  /* ── TAGESAUSWERTUNG ── */
                  <>
                    <h3 style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:22, fontWeight:700, textTransform:"uppercase", color:C.accent, marginBottom:18, letterSpacing:"0.04em" }}>
                      {DAYS[curDay]} — Tagesauswertung
                    </h3>

                    <div style={{ ...card, marginBottom:14 }}>
                      <label style={lbl}>Unterversorgte Viertel (aktiv anklicken)</label>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                        {DISTRICTS.map(d=>{
                          const s = day.eval.underserved.includes(d);
                          return (
                            <button key={d} onClick={()=>toggleDistrict(d)} style={{
                              padding:"4px 11px", borderRadius:3,
                              border:`1px solid ${s ? C.danger : C.border}`,
                              background: s ? C.danger+"33" : "transparent",
                              color: s ? C.danger : C.muted,
                              fontSize:12, cursor:"pointer", fontWeight:s?600:400,
                            }}>{d}</button>
                          );
                        })}
                      </div>
                    </div>

                    <div style={{ ...card, marginBottom:14, display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14 }}>
                      {[["deaths","☠ Todesfälle",C.danger],["ruins","🏚 Ruinen",C.warn],["uprisings","🚨 Aufstandsm.",C.purple]].map(([key,label,col])=>(
                        <div key={key} style={{ textAlign:"center" }}>
                          <div style={{ fontSize:11, color:C.muted, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:10 }}>{label}</div>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:10 }}>
                            <button onClick={()=>updEval(key,Math.max(0,day.eval[key]-1))} style={{ width:28, height:28, borderRadius:4, border:`1px solid ${C.border}`, background:"transparent", color:C.text, fontSize:17, cursor:"pointer", lineHeight:"1" }}>−</button>
                            <span style={{ fontSize:28, fontWeight:700, fontFamily:"'IBM Plex Mono',monospace", color:col, minWidth:28, textAlign:"center" }}>{day.eval[key]}</span>
                            <button onClick={()=>updEval(key,day.eval[key]+1)} style={{ width:28, height:28, borderRadius:4, border:`1px solid ${C.border}`, background:"transparent", color:C.text, fontSize:17, cursor:"pointer", lineHeight:"1" }}>＋</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div style={{ ...card, marginBottom:14 }}>
                      <label style={lbl}>Koordination im Krisenstab heute</label>
                      <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap" }}>
                        {[["gut",C.success,"✓ Gut"],["gemischt",C.warn,"~ Gemischt"],["schlecht",C.danger,"✗ Problematisch"]].map(([v,col,lb])=>{
                          const s = day.eval.coordination===v;
                          return (
                            <button key={v} onClick={()=>updEval("coordination",v)} style={{
                              padding:"7px 16px", borderRadius:4,
                              border:`1px solid ${s ? col : C.border}`,
                              background: s ? col+"33" : "transparent",
                              color: s ? col : C.muted,
                              fontSize:13, cursor:"pointer", fontWeight:s?600:400,
                            }}>{lb}</button>
                          );
                        })}
                      </div>
                      <label style={lbl}>Beobachtungen zum Tagesabschluss</label>
                      <textarea style={ta}
                        placeholder="Was ist heute besonders aufgefallen? Dynamiken im Stab, kritische Momente, gute Entscheidungen..."
                        value={day.eval.notes}
                        onChange={e=>updEval("notes",e.target.value)} />
                    </div>

                    <div style={{ ...card, marginBottom:22, borderColor:C.accentB }}>
                      <div style={{ fontSize:12, color:C.muted, marginBottom:10 }}>Optionaler Spielabschluss:</div>
                      <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end" }}>
                        <div>
                          <label style={lbl}>Ergebnis</label>
                          <select style={selS} value={result.won===null?"":result.won?"won":"lost"}
                            onChange={e=>setResult(r=>({...r,won:e.target.value===""?null:e.target.value==="won"}))}>
                            <option value="">Spiel läuft noch</option>
                            <option value="won">Gewonnen ✓</option>
                            <option value="lost">Verloren ✗</option>
                          </select>
                        </div>
                        <div>
                          <label style={lbl}>Endpunktzahl</label>
                          <input style={{ ...inp, width:100 }} type="number" placeholder="Punkte"
                            value={result.score}
                            onChange={e=>setResult(r=>({...r,score:e.target.value}))} />
                        </div>
                      </div>
                    </div>
                  </>
                )}

                <div style={{ display:"flex", justifyContent:"flex-end" }}>
                  <button style={btn} onClick={advance}>
                    {curPeriod==="tag"   ? "Nacht-Phase →"
                    :curPeriod==="nacht" ? "Tagesauswertung →"
                    :curDay>=6           ? "After Action Review →"
                                         : `${DAYS[curDay+1]} beginnen →`}
                  </button>
                </div>
              </div>

              {/* ── Sidebar: log ── */}
              <div style={{ borderLeft:`1px solid ${C.border}`, paddingLeft:20, overflowY:"auto", maxHeight:"calc(100vh - 80px)" }}>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:12, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.12em", color:C.muted, marginBottom:18 }}>
                  Spielprotokoll
                </div>
                {days.map((d,di)=>(
                  <div key={di} style={{ marginBottom:18 }}>
                    <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.06em", fontFamily:"'Barlow Condensed', sans-serif", textTransform:"uppercase", color:di===curDay?C.accent:C.muted, borderBottom:`1px solid ${C.border}`, paddingBottom:6, marginBottom:8 }}>
                      {DAYS[di]}
                      {di===curDay && <span style={{ fontSize:10, color:pColor, marginLeft:6 }}>← aktuell</span>}
                    </div>
                    {["tag","nacht"].map(p=>{
                      const per=d[p];
                      if (!per.events.length && !per.priorities) return null;
                      return (
                        <div key={p} style={{ marginBottom:8, paddingLeft:8, borderLeft:`2px solid ${p==="tag"?"rgba(59,130,246,0.2)":"rgba(139,92,246,0.2)"}` }}>
                          <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>
                            {p==="tag"?"Tag":"Nacht"}
                            {per.confidence<=2 && <span style={{ color:C.danger, marginLeft:6 }}>⚠ unsicher</span>}
                          </div>
                          {per.events.map(ev=>(
                            <div key={ev.id} style={{ fontSize:12, color:C.text, marginBottom:2 }}>
                              {EVENT_ICONS[ev.type]} <span style={{ color:C.accent }}>{ev.district}</span>
                            </div>
                          ))}
                          {per.priorities && (
                            <div style={{ fontSize:11, color:C.muted, marginTop:4, fontStyle:"italic", lineHeight:1.5 }}>
                              {per.priorities.slice(0,90)}{per.priorities.length>90?"…":""}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {(d.eval.deaths>0||d.eval.ruins>0||d.eval.uprisings>0) && (
                      <div style={{ display:"flex", gap:5, marginTop:5, flexWrap:"wrap" }}>
                        {d.eval.deaths>0    && <span style={{ ...hexBadge(C.danger), fontSize:10 }}>☠ {d.eval.deaths}</span>}
                        {d.eval.ruins>0     && <span style={{ ...hexBadge(C.warn),   fontSize:10 }}>🏚 {d.eval.ruins}</span>}
                        {d.eval.uprisings>0 && <span style={{ ...hexBadge(C.purple), fontSize:10 }}>🚨 {d.eval.uprisings}</span>}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* ════════════════ AAR SCREEN ════════════════ */
      if (phase === "aar") {
        const allEvents = days.flatMap((d,di)=>[
          ...d.tag.events.map(e=>({...e,day:DAYS[di],period:"Tag"})),
          ...d.nacht.events.map(e=>({...e,day:DAYS[di],period:"Nacht"})),
        ]);
        const lowConfPhases = days.reduce((a,d,i)=>[
          ...a,
          ...(d.tag.confidence<=2   ? [`${DAYS[i]} Tag`]   : []),
          ...(d.nacht.confidence<=2  ? [`${DAYS[i]} Nacht`] : []),
        ],[]);
        const allDisputes = days.flatMap((d,i)=>[
          d.tag.disputes   ? `${DAYS[i]} / Tag: ${d.tag.disputes}`   : null,
          d.nacht.disputes ? `${DAYS[i]} / Nacht: ${d.nacht.disputes}` : null,
        ].filter(Boolean));

        return (
          <div style={{ minHeight:"100vh", background:C.bg, color:C.text }}>

            <div className="no-print" style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:"12px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
              <div>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:20, fontWeight:700, letterSpacing:"0.07em", color:C.accent, textTransform:"uppercase" }}>
                  ◈ After Action Review — {session.scenario||"Neustart"}
                </div>
                <div style={{ fontSize:11, color:C.muted, letterSpacing:"0.08em", textTransform:"uppercase", marginTop:2 }}>
                  {session.date} · {session.facilitator} · {session.participants}
                </div>
              </div>
              <div style={{ display:"flex", gap:10 }}>
                <button style={{ ...btn, background:"transparent", color:C.muted, border:`1px solid ${C.border}`, padding:"7px 14px", fontSize:12 }}
                  onClick={()=>{setPhase("game"); setCurPeriod("eval");}}>← Zurück</button>
                <button style={btn} onClick={()=>window.print()}>⎙ Drucken / PDF</button>
              </div>
            </div>

            <div style={{ maxWidth:780, margin:"0 auto", padding:"28px 20px" }}>

              {/* Stats */}
              <div style={{ ...card, marginBottom:22, borderColor:C.accentB, background:"#0c0f18" }}>
                <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:13, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:C.accent, marginBottom:16 }}>
                  Spielstatistik
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:16 }}>
                  {[["☠","Todesfälle",stats.deaths,C.danger],
                    ["🏚","Ruinen",stats.ruins,C.warn],
                    ["🚨","Aufstände",stats.uprisings,C.purple],
                    ["📦","Unterversorgt\n(Viertel-Tage)",stats.underserved,"#6b7280"]
                  ].map(([ic,lb,v,col])=>(
                    <div key={lb} style={{ textAlign:"center", padding:12, background:C.surface, borderRadius:6, border:`1px solid ${C.border}` }}>
                      <div style={{ fontSize:18, marginBottom:4 }}>{ic}</div>
                      <div style={{ fontSize:26, fontWeight:700, fontFamily:"'IBM Plex Mono',monospace", color:col }}>{v}</div>
                      <div style={{ fontSize:10, color:C.muted, textTransform:"uppercase", letterSpacing:"0.06em", marginTop:3, whiteSpace:"pre" }}>{lb}</div>
                    </div>
                  ))}
                </div>
                <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                  {result.won!==null  && <span style={hexBadge(result.won?C.success:C.danger)}>{result.won?"✓ Gewonnen":"✗ Verloren"}</span>}
                  {result.score       && <span style={hexBadge(C.accent)}>Punkte: {result.score}</span>}
                  {stats.lowConf>0    && <span style={hexBadge(C.warn)}>{stats.lowConf}× niedrige Entscheidungssicherheit</span>}
                  {stats.fuelLow>0    && <span style={hexBadge(C.danger)}>⛽ Treibstoffmangel in {stats.fuelLow} Phasen</span>}
                  {stats.suppLow>0    && <span style={hexBadge(C.warn)}>📦 Versorgungsmangel in {stats.suppLow} Phasen</span>}
                </div>
              </div>

              {/* Disputes */}
              {allDisputes.length>0 && (
                <div style={{ ...card, marginBottom:18, borderColor:C.warn+"44", background:C.warn+"09" }}>
                  <div style={{ fontSize:13, fontWeight:600, color:C.warn, marginBottom:10 }}>⚠ Protokollierte Unklarheiten &amp; Kontroversen</div>
                  {allDisputes.map((d,i)=>(
                    <div key={i} style={{ fontSize:13, color:C.muted, marginBottom:5, paddingLeft:12, borderLeft:`2px solid ${C.warn}40`, lineHeight:1.5 }}>{d}</div>
                  ))}
                </div>
              )}

              {/* Event log */}
              {allEvents.length>0 && (
                <div style={{ ...card, marginBottom:22 }}>
                  <div style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:13, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", color:C.muted, marginBottom:12 }}>
                    Ereignisprotokoll ({allEvents.length} Ereignisse)
                  </div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                    {allEvents.map((e,i)=>(
                      <div key={i} style={{ fontSize:12, background:"#080b12", border:`1px solid ${C.border}`, borderRadius:3, padding:"3px 9px", color:C.muted }}>
                        <span style={{ color:C.text }}>{EVENT_ICONS[e.type]} {e.type}</span>
                        {" · "}
                        <span style={{ color:C.accent }}>{e.district}</span>
                        {" · "}
                        <span style={{ fontSize:10 }}>{e.day} {e.period}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* AAR Questions */}
              <div style={{ marginBottom:16 }}>
                <h2 style={{ fontFamily:"'Barlow Condensed', sans-serif", fontSize:26, fontWeight:700, textTransform:"uppercase", color:C.text, marginBottom:4 }}>Reflexionsfragen</h2>
                <p style={{ fontSize:13, color:C.muted, lineHeight:1.7, marginBottom:22 }}>
                  Besprecht die folgenden Fragen gemeinsam im Krisenstab. Haltet die wichtigsten Erkenntnisse fest — die Hinweise basieren auf eurem Spielprotokoll.
                </p>
              </div>

              <AARQuestion num="01" title="Was war der Plan?"
                hint={session.notes ? `Lernziele der Session: „${session.notes.slice(0,120)}${session.notes.length>120?"…":""}"` : "Welche Strategie hatte die Gruppe zu Spielbeginn? Was sollte priorisiert werden?"}
                value={aar.planned} onChange={v=>setAar(a=>({...a,planned:v}))} />

              <AARQuestion num="02" title="Was ist tatsächlich passiert?"
                hint={allEvents.length>0
                  ? `${allEvents.length} Ereignisse protokolliert, darunter: ${[...new Set(allEvents.map(e=>e.type))].join(", ")}. Welche waren spielentscheidend?`
                  : "Beschreibt den Verlauf des Spiels – welche Ereignisse haben den Ausgang bestimmt?"}
                value={aar.happened} onChange={v=>setAar(a=>({...a,happened:v}))} />

              <AARQuestion num="03" title="Was lief gut?"
                hint="Gute Entscheidungen, gelungene Koordination, effizientes Ressourcenmanagement, funktionierende Kommunikation..."
                value={aar.wentWell} onChange={v=>setAar(a=>({...a,wentWell:v}))} />

              <AARQuestion num="04" title="Was lief schlecht oder war überraschend schwierig?"
                hint={[
                  lowConfPhases.length>0 && `Niedrige Entscheidungssicherheit in: ${lowConfPhases.join(", ")}.`,
                  stats.deaths>0         && `${stats.deaths} Todesfälle im Spielverlauf.`,
                  stats.uprisings>0      && `${stats.uprisings} Aufstandsmarker wurden gesetzt.`,
                  stats.fuelLow>0        && `Treibstoff war in ${stats.fuelLow} Phasen knapp.`,
                ].filter(Boolean).join(" ") || "Wo lag der Krisenstab falsch? Was war unerwartet schwierig?"}
                value={aar.wentPoorly} onChange={v=>setAar(a=>({...a,wentPoorly:v}))} />

              <AARQuestion num="05" title="Was würden wir beim nächsten Mal anders machen?"
                hint="Konkrete Verhaltens- und Strategieänderungen — sowohl im Spiel als auch in der realen Stabsarbeit."
                value={aar.different} onChange={v=>setAar(a=>({...a,different:v}))} />

              <AARQuestion num="06" title="Transfer: Was bedeutet das für echte Krisenvorsorge?"
                hint="Welche Erkenntnisse aus dem Spiel lassen sich auf reale Blackout-Szenarien übertragen? Was nehmen die Teilnehmenden konkret mit in ihre Organisation?"
                value={aar.transfer} onChange={v=>setAar(a=>({...a,transfer:v}))} />

              <div className="no-print" style={{ display:"flex", gap:12, marginTop:8, marginBottom:48 }}>
                <button style={btn} onClick={()=>window.print()}>⎙ AAR drucken / als PDF speichern</button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
