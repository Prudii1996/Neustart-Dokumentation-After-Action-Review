<style>
:root{
    --bg:#0c0f18; --surface:#141824; --deep:#080b12; --border:#252d3d;
    --accent:#f59e0b; --text:#dde3f0; --muted:#7a8599;
    --danger:#ef4444; --warn:#f59e0b; --ok:#10b981; --purple:#8b5cf6; --blue:#3b82f6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);min-height:100%}
  body{font-family:'IBM Plex Sans',sans-serif;-webkit-text-size-adjust:100%}
  input,textarea,select,button{font-family:inherit;font-size:100%}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(245,158,11,.14);outline:none}
  button{cursor:pointer}
  button:hover{filter:brightness(1.12)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .wrap{max-width:1140px;margin:0 auto;padding:20px 16px}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .side{border-left:1px solid var(--border);padding-left:20px;overflow-y:auto;max-height:calc(100vh - 96px)}
  .bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;
       display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
       position:sticky;top:0;z-index:20}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:14px}
  .hd{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
      text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
  label.l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
  .in{background:var(--deep);border:1px solid var(--border);border-radius:4px;color:var(--text);
      padding:9px 12px;font-size:14px;width:100%}
  textarea.in{resize:vertical;min-height:78px;line-height:1.55}
  .btn{background:var(--accent);color:#111;border:none;border-radius:4px;padding:10px 22px;
       font-size:13px;font-weight:800;font-family:'Barlow Condensed',sans-serif;
       letter-spacing:.08em;text-transform:uppercase}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 14px;font-size:12px}
  .chip{padding:5px 11px;border-radius:3px;border:1px solid var(--border);background:transparent;
        color:var(--muted);font-size:12.5px;line-height:1.3}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .num{font-family:'IBM Plex Mono',monospace;font-weight:700}
  .h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;
      text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
  .stepper{width:30px;height:30px;border-radius:4px;border:1px solid var(--border);
           background:transparent;color:var(--text);font-size:17px;line-height:1}
  .save{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .note{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}
  .mrow{display:grid;grid-template-columns:3fr 2fr 1.2fr auto;gap:8px;margin-bottom:8px;align-items:start}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    .side{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:18px;max-height:none}
    .grid2,.grid3{grid-template-columns:1fr}
    .grid4{grid-template-columns:repeat(2,1fr)}
    .bar{position:static}
    .mrow{grid-template-columns:1fr 1fr}
  }
  
  .print-only{display:none}
  .pv{font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--text)}
  .mtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .mtable th{text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 8px}
  .mtable td{border-bottom:1px solid var(--border);padding:8px;vertical-align:top}
  .mtable td:first-child{width:58%}
  .summary .sum-head{border-bottom:2px solid var(--accent);padding-bottom:12px;margin:8px 0 18px}
  .summary .sum-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.2}
  .summary .sum-meta{font-size:12.5px;color:var(--muted);margin-top:6px}
  .summary .sum-sec{margin-bottom:18px}
  .summary h3{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px;color:var(--accent)}
  .summary p,.summary li{font-size:14px;line-height:1.65}
  .summary ul{padding-left:20px}
  .summary .sum-measures{border:2px solid var(--ok);border-radius:6px;padding:14px 16px}
  .summary .sum-foot{font-size:11px;color:var(--muted);margin-top:22px;line-height:1.5}
  @media (pointer:coarse){ .kbd-hint{display:none} }

  @media print{
    @page{margin:16mm 14mm}
    .no-print{display:none!important}
    .print-only{display:block!important}
    table.print-only{display:table!important}
    body,html{background:#fff!important;color:#111!important}
    .wrap{padding:0!important;max-width:none!important}
    .card{border-color:#cbd5e1!important;background:#fff!important;break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}

14 der Normalfall, f\xFCr den die meisten Vorsorgepl\xE4ne geschrieben sind."},"Zell-Herbertingen (mittel)":{grad:"mittel",empf:"Deutlich h\xF6herer Schwierigkeitsgrad als Schwarzbach.",profil:"Zell ist mittelalterlichen Ursprungs, war aber f\xFCr die Eisenbahn geografisch nicht erreichbar. Der Bahnhof entstand im Weiler Herbertingen, der daraufhin Menschen und Betriebe anzog. 1954 schlossen sich beide Orte samt der D\xF6rfer dazwischen zusammen.",struktur:"Lange Wege und verbesserungsbed\xFCrftig platzierte Verwaltungszentren. Man merkt der Stadt an, dass sie keine gewachsene Kommunalstruktur hat, sondern aus einer Fusion entstand.",folge:"Einsatzkr\xE4fte sind l\xE4nger unterwegs, Treibstoff wird zum knappen Gut. Zust\xE4ndigkeiten und Standorte passen nicht zur tats\xE4chlichen Siedlungsstruktur.",transfer:"Die Fusionsgemeinde. Wer aus einer Kommune nach Gebietsreform kommt, wird die Gemengelage aus historischen Standorten und heutiger Bev\xF6lkerungsverteilung wiedererkennen."},"Stephansfeld a.d. Fritzel (schwer)":{grad:"schwer",empf:"Laut Anleitung nur von erfahrenen Krisenst\xE4ben sicher zu bew\xE4ltigen.",profil:"Das St\xE4dtchen liegt im engen Tal der Fritzel. Steile H\xE4nge verhinderten jede Ausdehnung in die Breite, neue Viertel konnten nur flussauf- und abw\xE4rts anschlie\xDFen. In den Nebent\xE4lern liegen D\xF6rfer, eingemeindet 1960, 1968 und 1974.",struktur:"Alle Hauptverkehrswege verlaufen an den Ufern der Fritzel und sind entsprechend lang. Die Stadt ist ein Band, keine Fl\xE4che.",folge:"Es gibt keine Ausweichrouten. Jede Bewegung kostet viele Treibstoffeinheiten, Teams sind lange gebunden. Die Anleitung spricht von nahezu unl\xF6sbaren Aufgaben f\xFCr die Verwaltung.",transfer:"Die topografisch gefesselte Kommune \u2014 Tallage, Insellage, Randlage. Wo es nur einen Weg hinein und hinaus gibt, versagt jede Planung, die Redundanz voraussetzt."},"Eigener Aufbau":{grad:"selbst gew\xE4hlt",empf:"Der Schwierigkeitsgrad h\xE4ngt davon ab, wie ihr die 15 Aufleger anordnet.",profil:"Ein selbst zusammengestellter Stadtplan.",struktur:"Die Struktur bestimmt ihr. Entscheidend ist, wie weit die Standorte von Feuerwehr, Polizei, Rettungsdienst und Bauhof von den dicht besiedelten Vierteln entfernt liegen.",folge:"Je l\xE4nger die Wege und je ungleicher die Standorte verteilt sind, desto h\xE4rter wird die Lage.",transfer:"Reizvoll ist, die eigene Kommune nachzubauen \u2014 dann wird das Spiel zur Probe auf die tats\xE4chliche eigene Struktur."}},Ps={kommune:{label:"Kommune",stadt:"Ihre Stadt",frage:"Welcher Stadttyp kommt Ihrer eigenen Kommune am n\xE4chsten \u2014 die gewachsene Stadt, die Fusionsgemeinde oder die topografisch gefesselte Lage? Und was hie\xDFe das f\xFCr Ihre Wege im Ernstfall?",transfer:null,regie:null},staat:{label:"Beh\xF6rden der Staatsverwaltung",stadt:"Die Stadt im Spiel",frage:"Welche Aufgaben Ihrer Beh\xF6rde m\xFCssen auch ohne Strom, Telefon und Netz weiterlaufen? Und wer entscheidet bei Ihnen dar\xFCber, wenn die Leitung nicht erreichbar ist?",transfer:{"Schwarzbach (leicht)":"Kurze Wege und verteilte Kr\xE4fte entsprechen einer Beh\xF6rde mit klaren Zust\xE4ndigkeiten und gut erreichbaren Standorten. Auch dann bleibt die Frage, ob der Notbetrieb vorab geregelt ist oder erst in der Lage erfunden werden muss.","Zell-Herbertingen (mittel)":"Die Fusionsstadt entspricht einer Beh\xF6rde nach Zusammenlegung oder Reform: mehrere Standorte, gewachsene Zust\xE4ndigkeiten, die nicht ganz zur heutigen Organisation passen. Wer w\xE4re im Ernstfall wo \u2014 und wie erreicht man sich ohne Telefon?","Stephansfeld a.d. Fritzel (schwer)":"Die Stadt ohne Ausweichroute steht f\xFCr Engp\xE4sse ohne Ersatz: ein Geb\xE4ude, ein Rechenzentrum, eine Person, die als Einzige Bescheid wei\xDF. Wo hat Ihre Beh\xF6rde solche Engp\xE4sse?","Eigener Aufbau":"Ein eigener Aufbau kann die Verteilung Ihrer Dienststellen und Au\xDFenstellen grob nachbilden."},regie:{t:"Perspektivwechsel ansprechen:",d:"Die Gruppe spielt ei
